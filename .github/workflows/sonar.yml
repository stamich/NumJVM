name: sonar

# Static analysis and coverage on SonarCloud.
#
# Needs the repository secret SONAR_TOKEN and "Automatic Analysis" switched off in the
# SonarCloud project (CI-based analysis replaces it). Pull requests from forks get no
# secrets; for them the analysis step is skipped and the job still passes.

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for blame data and new-code detection

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, test and coverage
        run: ./gradlew build --stacktrace

      - name: Analyse
        if: env.SONAR_TOKEN != ''
        run: ./gradlew sonar --stacktrace

      - name: Analysis skipped
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not available; SonarCloud analysis skipped."
