name: build

on:
  push:
    branches: [ "**" ]
  pull_request:

# Least privilege: read-only by default; the build job may additionally publish the
# test-results check run.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK 25)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Coverage summary
        run: python3 scripts/coverage_summary.py numjvm-core numjvm-io

      - name: Run examples
        run: ./gradlew --quiet :examples:basic-arrays:run :examples:memory-scopes:run :examples:accelerated-arrays:run :examples:matmul:run

      - name: Consume the published artifacts from a separate build
        run: |
          bash scripts/check_consumers.sh
          ./gradlew publish --console=plain
          bash scripts/check_jit_consumers.sh
          bash scripts/check_050_consumers.sh

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@b7b80d7ac5b1da46d6aaff9fb57ad50d8453bcb3  # v6.6.0
        with:
          check_name: test results
          report_paths: "**/build/test-results/test/TEST-*.xml"
          detailed_summary: true
          include_passed: false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
