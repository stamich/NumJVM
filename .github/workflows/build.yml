name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Run examples
        run: ./gradlew --quiet :examples:basic-arrays:run :examples:memory-scopes:run

      - name: Consume the published artifacts from a separate build
        run: |
          ./gradlew --quiet publishToMavenLocal
          ./gradlew --quiet -p release-check run

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: test results
          report_paths: "**/build/test-results/test/TEST-*.xml"
          detailed_summary: true
          include_passed: false

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          retention-days: 7
