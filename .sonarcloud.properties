# Scope for SonarCloud's Automatic Analysis (decision D1, docs/quality/README.md).
#
# Automatic Analysis is only a stop-gap until CI-based analysis (.github/workflows/sonar.yml)
# is switched on; SonarCloud ignores this file once Automatic Analysis is off. Both modes
# analyse the same files: the main code of numjvm-core and numjvm-io, with their tests as
# test code.

sonar.sources=numjvm-core/src/main/java,numjvm-io/src/main/java
sonar.tests=numjvm-core/src/test/java,numjvm-io/src/test/java
sonar.exclusions=**/build/**
sonar.java.source=25
sonar.sourceEncoding=UTF-8
