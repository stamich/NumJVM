# jqwik configuration shared by all property tests in numjvm-io.
# A failing property prints its seed; re-run it with @Property(seed = "...").
jqwik.tries.default = 200
jqwik.reporting.onlyfailures = true
jqwik.edgecases.default = MIXIN
jqwik.failures.after.default = SAMPLE_FIRST
jqwik.database = build/jqwik-database
